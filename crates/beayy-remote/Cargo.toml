[package]
name = "beayy-remote"
description = "手表录音的对话转写、iPhone 停留点：经账号同步拿到、交转写服务转写，写成 speech.* / place.visit 事件；旧的录音服务器（v1）过渡期照拉"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native-tls"]
native-tls = ["ureq/native-tls", "beayy-sync/native-tls"]
# Android NDK 没有可用的系统 TLS 库，走 rustls + 内置根证书
rustls = ["ureq/rustls", "beayy-sync/rustls"]

[dependencies]
beayy-core.workspace = true
# 写路径 + default-features = false：TLS 后端只由本 crate 的 feature 决定（见上）。
# 用 workspace = true 会带上默认 feature → native-tls → openssl-sys，Android 编不过。
beayy-sync = { path = "../beayy-sync", default-features = false }
base64 = "0.22"
serde_json.workspace = true
chrono.workspace = true
ureq = { version = "3", default-features = false, features = ["json"] }
