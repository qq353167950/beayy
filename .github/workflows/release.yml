name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p beayy
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/beayy.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "Beayy-${env:RELEASE_TAG}-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: Beayy-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p beayy
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/beayy dist/
          cp README.md LICENSE dist/
          tar -czf "Beayy-${RELEASE_TAG}-macos-arm64.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: Beayy-*-macos-arm64.tar.gz
          if-no-files-found: error

  android:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-aarch64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust library
        run: |
          cargo ndk -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build --release -p beayy-mobile \
            --no-default-features --features rustls
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Beayy-${RELEASE_TAG}-android-arm64-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: Beayy-*-android-arm64-debug.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, macos, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lah dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Beayy ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Automated artifacts for `${{ github.ref_name }}`.

            Included:
            - Windows x64 ZIP
            - macOS arm64 tarball
            - Android arm64 debug APK

            iOS is not included because this repository does not contain an Xcode/Swift host project.
          files: dist/*
